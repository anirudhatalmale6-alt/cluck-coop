<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cluck Coop 🐔 - Chicken Farm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --green1: #7ec850; --green2: #5fa833; --sky1: #aee9ff; --sky2: #7fd4ff;
    --wood: #b5763a; --wood-d: #8a5624; --gold: #ffcf3f; --card: #fffef7;
    --ink: #3a2a15; --shadow: rgba(80,50,20,.25);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky1), var(--sky2) 40%, var(--green1) 40%, var(--green2));
    overflow: hidden; user-select: none;
  }
  .app { max-width: 520px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }

  /* ---------- Auth ---------- */
  #auth {
    position: absolute; inset: 0; z-index: 50;
    background: linear-gradient(180deg, #aee9ff, #7ec850);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  #auth .logo { font-size: 72px; margin-bottom: 4px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
  #auth h1 { font-size: 30px; color: #fff; text-shadow: 0 3px 0 var(--wood-d); letter-spacing: .5px; }
  #auth p.sub { color: #fff; opacity: .95; margin: 4px 0 22px; font-weight: 600; }
  .authbox { background: var(--card); border-radius: 22px; padding: 22px; width: 100%; max-width: 340px; box-shadow: 0 10px 0 var(--shadow); }
  .authbox input {
    width: 100%; padding: 14px 16px; margin-bottom: 12px; border-radius: 14px;
    border: 3px solid #ecd9b0; font-size: 16px; background: #fffdf4; outline: none;
  }
  .authbox input:focus { border-color: var(--gold); }
  .tabs { display: flex; margin-bottom: 16px; background: #f1e6cd; border-radius: 14px; padding: 4px; }
  .tabs button { flex: 1; padding: 10px; border: none; background: none; font-size: 15px; font-weight: 700; border-radius: 11px; color: #9a8250; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .err { color: #d1453b; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 6px; font-weight: 600; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: linear-gradient(180deg, var(--wood), var(--wood-d));
    box-shadow: 0 3px 0 rgba(0,0,0,.18); z-index: 20;
  }
  .pill {
    display: flex; align-items: center; gap: 6px; background: var(--card);
    border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.06);
  }
  .pill.coins { color: #b8860b; }
  .pill .ic { font-size: 18px; }
  .topbar .name { color: #fff; font-weight: 700; margin-left: auto; font-size: 13px; opacity: .95; }
  .logout { background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 12px; }

  /* ---------- Farm area ---------- */
  .farm { flex: 1; overflow-y: auto; padding: 14px 12px 96px; -webkit-overflow-scrolling: touch; }
  .actionbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .bigbtn {
    flex: 1; border: none; border-radius: 16px; padding: 14px 8px; font-weight: 800; font-size: 15px;
    color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.2); position: relative; transition: transform .05s;
  }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .bigbtn.collect { background: linear-gradient(180deg,#ffd95e,#f5b301); color:#5a3d00; }
  .bigbtn.sell { background: linear-gradient(180deg,#7ed957,#42a91f); }
  .badge {
    position: absolute; top: -8px; right: -6px; background: #e8442e; color: #fff;
    border-radius: 999px; min-width: 22px; height: 22px; font-size: 12px; line-height: 22px;
    padding: 0 6px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.2);
  }
  .coop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .coop { position: relative; display: flex; flex-direction: column; align-items: stretch; }
  /* peaked roof */
  .coop .roof {
    height: 22px; margin: 0 -3px -1px; z-index: 1;
    background: linear-gradient(180deg, #cf6038, #9c3f1e);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.12));
  }
  /* wooden hen house body with faint plank lines */
  .coop .house {
    position: relative; padding: 8px 4px 9px; text-align: center;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.06) 0 1px, transparent 1px 15px),
      linear-gradient(180deg, #97632f, #6f4522);
    border: 2px solid #5e3a1c; border-top: none; border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 0 var(--shadow);
  }
  .coop .chick { position: relative; z-index: 2; font-size: 38px; line-height: 1; display: block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
  /* straw nest the hen sits on */
  .coop .nest {
    position: relative; z-index: 2; width: 74%; height: 13px; margin: -6px auto 0;
    background: radial-gradient(ellipse at 50% 0, #f6cd5e 40%, #d99f2f);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
  }
  .coop .nest .eggs { position: absolute; top: -5px; left: 0; right: 0; font-size: 12px; letter-spacing: -3px; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
  .coop .cname { font-size: 11px; font-weight: 800; color: #fff; margin-top: 6px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .coop .timer { font-size: 10px; color: #ffe9b0; margin-top: 1px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .coop .eggbadge {
    position: absolute; top: -6px; right: -6px; z-index: 5; background: #fff; border: 2px solid var(--gold);
    border-radius: 999px; padding: 1px 7px; font-size: 12px; font-weight: 800; color: var(--ink);
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
  }
  .coop.ready .house { box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--shadow); }
  /* empty build plot */
  .coop.empty { justify-content: center; }
  .coop.empty .plot {
    min-height: 108px; border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    background: rgba(255,255,255,.25); border: 3px dashed rgba(255,255,255,.7);
  }
  .coop.empty .plus { font-size: 34px; color: rgba(255,255,255,.95); font-weight: 300; line-height: 1; }
  .coop.empty .lbl { font-size: 10px; color: #fff; font-weight: 700; }

  .sectitle { color: #fff; font-weight: 800; font-size: 15px; margin: 18px 4px 8px; text-shadow: 0 2px 0 rgba(0,0,0,.15); }

  /* ---------- Bottom nav ---------- */
  .nav {
    position: absolute; bottom: 0; left: 0; right: 0; display: flex;
    background: linear-gradient(180deg,#fffef7,#f3e7c9); box-shadow: 0 -3px 0 rgba(0,0,0,.08); z-index: 30;
  }
  .nav button { flex: 1; border: none; background: none; padding: 10px 0 12px; font-size: 11px; font-weight: 700; color: #a8905c; }
  .nav button .ni { display: block; font-size: 24px; margin-bottom: 2px; }
  .nav button.active { color: var(--wood-d); }
  .nav button.active .ni { transform: scale(1.15); }

  /* ---------- Sheet (shop/market) ---------- */
  .sheet-wrap { position: absolute; inset: 0; z-index: 40; display: none; }
  .sheet-wrap.open { display: block; }
  .sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%;
    background: linear-gradient(180deg,#fffef7,#fbf3df); border-radius: 22px 22px 0 0;
    padding: 14px 14px 24px; box-shadow: 0 -8px 30px rgba(0,0,0,.3); overflow-y: auto;
  }
  .sheet h2 { text-align: center; color: var(--ink); margin-bottom: 4px; font-size: 20px; }
  .sheet .close { position: absolute; top: 12px; right: 14px; background: #eee0c0; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; font-weight: 800; color: #7a6338; }
  .shop-item {
    display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px;
    padding: 10px 12px; margin-top: 10px; box-shadow: 0 3px 0 var(--shadow);
  }
  .shop-item .big { font-size: 40px; }
  .shop-item .info { flex: 1; }
  .shop-item .info .t { font-weight: 800; font-size: 15px; }
  .shop-item .info .d { font-size: 12px; color: #8a7550; margin-top: 1px; }
  .buybtn {
    border: none; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 14px; color: #fff;
    background: linear-gradient(180deg,#7ed957,#42a91f); box-shadow: 0 4px 0 #2f7a15; white-space: nowrap;
  }
  .buybtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2f7a15; }
  .buybtn.gold { background: linear-gradient(180deg,#ffd95e,#f5b301); box-shadow: 0 4px 0 #b8860b; color:#5a3d00; }
  .buybtn.dim { background: #cfc3a6; box-shadow: 0 4px 0 #a8996f; }
  .market-egg { display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:10px 12px; margin-top:10px; box-shadow:0 3px 0 var(--shadow); }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700;
    font-size: 14px; z-index: 60; opacity: 0; transition: all .25s; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .demo-tag { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.35); color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:6px; letter-spacing:.5px; z-index:21; }
</style>
</head>
<body>
<div class="app">
  <div class="demo-tag">DEMO</div>

  <!-- AUTH -->
  <div id="auth">
    <div class="logo">🐔</div>
    <h1>Cluck Coop</h1>
    <p class="sub">Raise chickens, collect eggs, grow your farm!</p>
    <div class="authbox">
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">Log In</button>
        <button id="tabReg" onclick="switchTab('register')">Sign Up</button>
      </div>
      <div class="err" id="authErr"></div>
      <input id="uname" placeholder="Username" autocomplete="off" autocapitalize="off">
      <input id="pass" type="password" placeholder="Password" autocomplete="off">
      <input id="refCode" placeholder="Referral code (optional)" autocomplete="off" autocapitalize="characters" style="display:none;text-transform:uppercase">
      <button class="buybtn" style="width:100%;padding:14px;font-size:16px" onclick="doAuth()">Let's Farm! 🥚</button>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="pill coins"><span class="ic">🪙</span><span id="coinCount">0</span></div>
    <div class="pill"><span class="ic">🐔</span><span id="chickenCount">0/0</span></div>
    <span class="name" id="playerName"></span>
    <button class="logout" onclick="logout()">Exit</button>
  </div>

  <!-- FARM -->
  <div class="farm" id="farmView">
    <div class="actionbar">
      <button class="bigbtn collect" onclick="collectAll()">
        🧺 Collect Eggs <span class="badge" id="collectBadge" style="display:none">0</span>
      </button>
      <button class="bigbtn sell" onclick="openSheet('market')">🏪 Sell at Market</button>
    </div>
    <div class="coop-grid" id="coopGrid"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="nav">
    <button class="active" id="navFarm" onclick="showFarm()"><span class="ni">🌾</span>Farm</button>
    <button onclick="openSheet('shop')"><span class="ni">🐣</span>Chickens</button>
    <button onclick="openSheet('market')"><span class="ni">🏪</span>Market</button>
    <button onclick="openSheet('invite')"><span class="ni">🎁</span>Invite</button>
    <button onclick="openSheet('coins')"><span class="ni">🪙</span>Coins</button>
  </div>

  <!-- SHEET -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-back" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="game.js"></script>
</body>
</html>
